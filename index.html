<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCaisse - Gestion Professionnelle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-20">

  <!-- En-tête / Header Bleu Nuit -->
  <header class="bg-slate-900 border-b border-slate-800 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-receipt text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">SmartCaisse</h1>
          <p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Système POS Pro</p>
        </div>
      </div>
      <span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 text-xs font-semibold px-3 py-1 rounded-full">Essai 72h</span>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Carte Statut / Période d'essai -->
    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between shadow-xl">
      <div>
        <p class="text-xs text-slate-400 font-medium">Statut du compte</p>
        <p class="text-base font-bold text-blue-400 mt-0.5">71h 59m d'essai restantes</p>
      </div>
      <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700/50">
        <i class="fa-solid fa-clock-rotate-left text-blue-400 text-xl"></i>
      </div>
    </div>

    <!-- Actions Rapides -->
    <div class="grid grid-cols-2 gap-3">
      <button class="bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-2xl shadow-lg shadow-blue-600/20 flex flex-col items-center justify-center space-y-2.5 border border-blue-400/20 transition-all active:scale-95">
        <i class="fa-solid fa-cart-plus text-xl"></i>
        <span class="font-semibold text-sm">Nouvelle Vente</span>
      </button>

      <button class="bg-slate-900 hover:bg-slate-800 text-slate-200 p-4 rounded-2xl shadow-md flex flex-col items-center justify-center space-y-2.5 border border-slate-800 transition-all active:scale-95">
        <i class="fa-solid fa-box-archive text-xl text-blue-400"></i>
        <span class="font-semibold text-sm">Gestion Stock</span>
      </button>
    </div>

    <!-- Tableau de bord Financier -->
    <div class="bg-slate-900 p-5 rounded-2xl shadow-xl border border-slate-800/80 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Aperçu Aujourd'hui</h2>
        <span class="text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md">En direct</span>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-xs text-slate-400">Total Ventes</p>
          <p class="text-xl font-bold text-white mt-1">0 <span class="text-xs font-normal text-slate-400">FCFA</span></p>
        </div>
        <div>
          <p class="text-xs text-slate-400">Créances (Dettes)</p>
          <p class="text-xl font-bold text-rose-400 mt-1">0 <span class="text-xs font-normal text-slate-400">FCFA</span></p>
        </div>
      </div>
    </div>

    <!-- Module IA SmartConseil -->
    <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-blue-950/60 text-white p-5 rounded-2xl shadow-xl border border-blue-900/40 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-brain text-blue-400 text-lg"></i>
          <h3 class="font-bold text-sm text-slate-200">SmartConseil IA</h3>
        </div>
        <span class="text-[10px] bg-blue-500/20 text-blue-300 font-semibold px-2 py-0.5 rounded border border-blue-400/30">PREMIUM</span>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">L'assistant analysera tes marges et préchiffrera tes bénéfices une fois tes premières ventes enregistrées.</p>
    </div>

  </main>

  <!-- Support Client Flottant -->
  <a href="https://wa.me/242064035691" target="_blank" class="fixed bottom-5 right-5 bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-2xl shadow-2xl shadow-blue-600/50 border border-blue-400/30 transition-all active:scale-90 flex items-center justify-center z-50">
    <i class="fa-brands fa-whatsapp text-2xl"></i>
  </a>

</body>
</html>
